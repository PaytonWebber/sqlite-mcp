name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        # The tmp dir must exist before zig can extract zip dependencies
        # (the sqlite amalgamation) into the cache.
        run: mkdir -p .zig-cache/tmp && zig build

      - name: Format check
        run: zig fmt --check build.zig src

      - name: Conformance check
        run: ./scripts/conformance.sh
